[tools]
node = "26"

[tasks.setup]
description = "Install the npm packages"
run = "npm ci"

[tasks.check]
description = "The gate before a commit: every linter, the build and the test"
depends = ["lint", "build", "test"]

[tasks."check:ci"]
description = "check as CI runs it"
depends = ["lint", "build", "test:ci"]

# typescript.json loads the plugin from dist/, so oxlint runs after build.
[tasks.lint]
description = "Every linter: types, oxlint through typescript.json, and format"
depends = ["build"]
run = "npm run lint"

[tasks."lint:fix"]
description = "Every linter's fix: oxlint and format"
depends = ["build"]
run = "npm run lint:fix"

[tasks.build]
description = "Compile the plugin in src/ into dist/"
run = "npm run build"

# The test packs the package without building it, so it runs after build, which it takes dist/ from.
[tasks.test]
description = "Lint the fixtures through the configs and the packed plugin"
depends = ["build"]
run = "npm test"

# test:ci runs the same test and writes no coverage, because the repo has no SonarQube project.
[tasks."test:ci"]
description = "test as CI runs it"
depends = ["build"]
run = "npm test"

# The Release workflow packs in a job apart from the checks. This install runs no dependency's scripts, so none of
# them runs where the tarball is made. npm pack builds dist/ in prepack.
[tasks.pack]
description = "Pack the package into the repo root, as the Release workflow publishes it"
run = ["npm ci --ignore-scripts", "npm pack"]

# The peers name the lowest versions that carry every rule the presets turn on. This installs those floors over the
# lockfile's versions, runs the test on them, and puts the lockfile's versions back, pass or fail.
[tasks."test:peer-floors"]
description = "test on the lowest version each peer dependency allows"
run = '''
#!/usr/bin/env bash
set -euo pipefail
trap 'npm ci --ignore-scripts --silent' EXIT
# A peer range is ^<floor>, so its floor is the range without the caret. Any other range form fails here.
floors=$(node -p "Object.entries(require('./package.json').peerDependencies).map(([name, range]) => { if (!/^\^\d+\.\d+\.\d+$/.test(range)) { throw new Error(name + ' peer ' + range + ' is not ^<version>'); } return name + '@' + range.slice(1); }).join(' ')")
echo "peer floors: $floors"
npm install --no-save --ignore-scripts --silent $floors
npm run build
npm test
'''
